services:
  - type: web
    name: brasil-burger
    env: docker
    plan: free
    branch: symfony-new
    healthCheckPath: /login
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: brasil-burger-db
          property: connectionString
